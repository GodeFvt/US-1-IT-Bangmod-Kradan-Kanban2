services:
  proxy:
    container_name: us1-proxy
    image: nginx:alpine
    configs:
      - source: proxyPublic_config
        target: /etc/nginx/conf.d/public.conf
      - source: proxyPrivate_config
        target: /etc/nginx/conf.d/private.conf
      - source: cerssl
        target: /etc/ssl/fullchain.pem
      - source: keyssl
        target: /etc/ssl/privkey.pem
    depends_on:
      - fe
      - api
    networks:
      - taskproj-net
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  fe:
    container_name: us1-frontend
    image: frontend:v2
    build:
      context: frontend
      args:
        VITE_CLIENT_ID: ${MS_CLIENT_ID}
        VITE_AUTHORITY: ${MS_AUTHORITY}
    networks:
      taskproj-net:
        aliases:
          - frontend
    restart: unless-stopped

  api:
    container_name: us1-backend
    image: backend:v2
    environment:
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${SECRET}
      - JWT_SECRET_REFRESH=${SECRET_REFRESH}
      - JWT_ISSUER=${ISSUER}
      - JWT_ISSUER_MS=${ISSUER_MS}
      - SMTP_SERVER=${SMTPSERVER}
      - SMTP_PORT=${SMTPPORT}
      - SMTP_USERNAME=${SMTPUSERNAME}
      - SMTP_PASSWORD=${SMTPPASSWORD}
    build:
      context: backend
    volumes:
      - ./task-files:/task-files
    networks:
      taskproj-net:
        aliases:
          - backend
    restart: unless-stopped

configs:
  proxyPrivate_config:
    file: proxy/private.conf
  proxyPublic_config:
    file: proxy/public.conf
  cerssl:
    file: ../ssl/fullchain.pem
  keyssl:
    file: ../ssl/privkey.pem
networks:
  taskproj-net:
